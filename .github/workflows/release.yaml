name: GitHub source release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-check-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check release version
        shell: Rscript {0}
        run: |
          desc <- read.dcf("DESCRIPTION")
          stopifnot(Sys.getenv("GITHUB_REF_NAME") == paste0("v", desc[1, "Version"]))
      - name: Build source package
        run: R CMD build --no-manual .
      - name: Check source package
        shell: Rscript {0}
        run: |
          pkg <- list.files(pattern = "^tsHtmlApp_.*[.]tar[.]gz$", full.names = TRUE)
          stopifnot(length(pkg) == 1L)
          rcmdcheck::rcmdcheck(pkg, args = "--no-manual", error_on = "warning")
      - name: Run JavaScript regression tests
        run: node --test tests/js/*.test.js
      - name: Publish checked source archive
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" tsHtmlApp_*.tar.gz --clobber
